name: Fetch source PDFs

on:
  push:
    branches: [site]
    paths: [".github/workflows/fetch-sources.yml", "scripts/fetch_sources.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install gdown
      - run: python scripts/fetch_sources.py
      - name: Commit sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources
          git commit -m "Add source PDFs fetched by workflow" || echo "nothing to commit"
          git push
