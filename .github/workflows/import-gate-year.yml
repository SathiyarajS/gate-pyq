name: Prepare a new GATE CS year

on:
  workflow_dispatch:
    inputs:
      year:
        description: Next exam year, for example 2027
        required: true
        type: number
      sessions:
        description: 'JSON array of {set, paper_url, key_url} entries using official PDF URLs'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: gate-cs-import-${{ inputs.year }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      YEAR: ${{ inputs.year }}
      SESSIONS: ${{ inputs.sessions }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-site.txt
      - name: Prepare and reconcile draft records
        run: |
          python -m pip install -r requirements-site.txt
          python scripts/prepare_year_import.py "$YEAR" --sessions "$SESSIONS"
          python scripts/validate.py
      # Only a branch is pushed, so the built-in token is enough: no PR, no stored secret.
      - name: Push the import branch
        run: |
          branch="import/gate-cs-$YEAR"
          if git ls-remote --exit-code --heads origin "$branch"; then
            echo "::error::Branch $branch already exists. Continue the import on it, or delete it to start again."
            exit 1
          else
            status=$?
            if [[ "$status" != 2 ]]; then exit "$status"; fi
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add -- "data/imports/$YEAR/"
          git diff --cached --check
          git commit -m "Prepare GATE CS $YEAR source and key inventory for review"
          git push origin "HEAD:refs/heads/$branch"
          {
            echo "Pushed \`$branch\` with the staged records in \`data/imports/$YEAR/\` (URLs and sha256 of the official PDFs; the PDFs themselves are not committed — \`python scripts/fetch_sources.py\` restores them)."
            echo
            echo "Next: run Codex with prompt G in HANDOFF.md for $YEAR. It continues on this branch and merges it into main."
          } >> "$GITHUB_STEP_SUMMARY"
