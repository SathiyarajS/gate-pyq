name: Review screenshots

# Screenshots each redrawn question next to its original crop, so a reviewer
# without a browser can do the rendered comparison docs/TRANSCRIPTIONS.md requires.
# Output goes to the `review-shots` branch (keeps main small):
#   review-shots:<paper>/<question_id>-desktop.jpg, -mobile-dark.jpg, index.json

on:
  push:
    branches: [main]
    paths: ["data/transcriptions/**", "figures/**"]
  workflow_dispatch:
    inputs:
      papers:
        description: "Paper IDs separated by spaces (blank = every paper with drafts)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: review-shots
  cancel-in-progress: false

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-site.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: |
          pip install -r requirements-site.txt gdown
          python -m playwright install --with-deps chromium
          npm ci --ignore-scripts
      - name: Restore 2007-2018 papers (hash-checked)
        continue-on-error: true
        run: python scripts/fetch_sources.py --archive-only
      - name: Work out which papers changed
        id: papers
        env:
          INPUT_PAPERS: ${{ github.event.inputs.papers }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            papers="$INPUT_PAPERS"
          elif git cat-file -e "$BEFORE" 2>/dev/null; then
            papers=$(git diff --name-only "$BEFORE" HEAD -- data/transcriptions figures \
              | grep -oE 'CS-[0-9]{4}(-S[0-9])?' | sort -u | tr '\n' ' ')
          fi
          echo "papers=$papers" >> "$GITHUB_OUTPUT"
          echo "Papers: ${papers:-every drafted paper}"
      - name: Screenshot comparisons
        run: |
          if [ -n "${{ steps.papers.outputs.papers }}" ]; then
            python scripts/screenshot_comparisons.py --out shots ${{ steps.papers.outputs.papers }}
          else
            python scripts/screenshot_comparisons.py --out shots --all-drafted
          fi
      - name: Publish to the review-shots branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          src=$(git rev-parse --short HEAD)
          if git ls-remote --exit-code origin refs/heads/review-shots >/dev/null; then
            git fetch --depth 1 origin review-shots
            git worktree add rs FETCH_HEAD
            git -C rs checkout -B review-shots
          else
            git worktree add --detach rs
            git -C rs checkout --orphan review-shots
            git -C rs rm -rqf .
          fi
          for d in shots/*/; do p=$(basename "$d"); rm -rf "rs/$p"; cp -r "$d" "rs/$p"; done
          printf '# Review screenshots\n\nOne folder per paper: `<question_id>-desktop.jpg` (1280 px, light) and `-mobile-dark.jpg` (390 px, dark), each showing the original crop next to the rendered redraw. `index.json` lists the files and the draft status. Generated by `.github/workflows/review-shots.yml`.\n' > rs/README.md
          git -C rs add -A
          git -C rs commit -q -m "Review screenshots for $(ls shots | tr '\n' ' ')(main $src)" || { echo "no changes"; exit 0; }
          git -C rs push origin review-shots
