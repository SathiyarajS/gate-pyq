name: Build and deploy site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-site.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: |
          pip install -r requirements-site.txt
          python -m playwright install --with-deps chromium
          npm ci --ignore-scripts
      - name: Validate data
        run: python scripts/validate.py
      - name: Build site (renders question images from sources/)
        run: python scripts/build_site.py --release
      - name: Build search index
        run: npx pagefind --site _site --glob 'search-docs/**/*.html' --output-subdir pagefind
      - name: Build PDFs (with answers + questions only, per subject)
        run: python scripts/build_pdfs.py --release
      - name: Check links
        run: python scripts/check_links.py _site
      - name: Report size
        run: du -sh _site _site/pdf _site/assets/questions
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
