name: Build and deploy site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-site.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('requirements-site.txt') }}
      - name: Install dependencies
        run: |
          pip install -r requirements-site.txt pytest
          # Headless rendering only needs the headless shell, not full Chromium.
          python -m playwright install --with-deps --only-shell chromium
          npm ci --ignore-scripts
      - name: Restore 2007-2018 papers from the official CS.zip (hash-checked)
        continue-on-error: true
        run: |
          pip install gdown
          python scripts/fetch_sources.py --archive-only
      - name: Validate data
        run: python scripts/validate.py
      # Simulated step-throughs, keyed inside on each spec and the simulator source.
      - name: Cache step-through simulations
        uses: actions/cache@v4
        with:
          path: .anim-cache
          key: anim-${{ hashFiles('scripts/animations/**', 'data/animations/**') }}
          restore-keys: anim-
      - name: Cache rendered question images
        uses: actions/cache@v4
        with:
          path: site-assets/q
          key: question-images-${{ hashFiles('data/crops.json', 'audits/crop-source-map.json', 'scripts/render_crops.py') }}
          restore-keys: question-images-
      # The tests build their own copy of the site, so they run alongside the real build.
      - name: Test, and build site (renders question images from sources/)
        run: |
          python -m pytest -q tests > "$RUNNER_TEMP/pytest.log" 2>&1 &
          tests=$!
          node tests/test_transcription_math.js
          node tests/test_anim_recursion_player.js
          node tests/test_anim_automata_player.js
          python scripts/build_site.py --release
          status=0; wait $tests || status=$?
          cat "$RUNNER_TEMP/pytest.log"
          exit $status
      - name: Browser regression for study views
        run: python scripts/checks/check_study_views_browser.py
      - name: Build search index
        run: npx pagefind --site _site --glob 'search-docs/**/*.html' --output-subdir pagefind
      # PDFs are keyed by content inside .pdf-cache, so only subjects whose
      # questions, images or layout changed are re-rendered.
      - name: Restore rendered PDFs
        uses: actions/cache/restore@v4
        with:
          path: |
            .pdf-cache
            .pdf-images
          key: pdfs-${{ github.sha }}
          restore-keys: pdfs-
      - name: Build PDFs (with answers + questions only, per subject)
        run: python scripts/build_pdfs.py --release
      - name: Save rendered PDFs
        uses: actions/cache/save@v4
        with:
          path: |
            .pdf-cache
            .pdf-images
          key: pdfs-${{ hashFiles('.pdf-cache/*.key') }}
        continue-on-error: true
      - name: Check links
        run: python scripts/check_links.py _site
      - name: Report size
        run: du -sh _site _site/pdf _site/assets/questions
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
