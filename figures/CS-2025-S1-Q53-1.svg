<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 450"><title>Two-level cache and main memory access times</title><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="currentColor"/></marker></defs><rect x="160" y="10" width="100" height="50" fill="none" stroke="currentColor"/><text x="210" y="40" font-size="16" text-anchor="middle" fill="currentColor" stroke="none">Processor</text><path d="M210 60 V90" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="100" y="90" width="220" height="80" fill="none" stroke="currentColor"/><text x="210" y="113" font-size="16" text-anchor="middle" fill="currentColor" stroke="none">L1 cache</text><text x="210" y="137" font-size="16" text-anchor="middle" fill="currentColor" stroke="none">Hit rate=95%,</text><text x="210" y="160" font-size="16" text-anchor="middle" fill="currentColor" stroke="none">Access time = 10 ns</text><path d="M210 170 V200" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="10" y="200" width="400" height="100" fill="none" stroke="currentColor"/><text x="210" y="222" font-size="16" text-anchor="middle" fill="currentColor" stroke="none">L2 cache</text><text x="210" y="245" font-size="16" text-anchor="middle" fill="currentColor" stroke="none">Hit rate=85%,</text><text x="210" y="269" font-size="16" text-anchor="middle" fill="currentColor" stroke="none">Access time (including L1 cache miss penalty)</text><text x="210" y="291" font-size="16" text-anchor="middle" fill="currentColor" stroke="none">= 20 ns</text><path d="M210 300 V330" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="10" y="330" width="400" height="110" fill="none" stroke="currentColor"/><text x="210" y="357" font-size="16" text-anchor="middle" fill="currentColor" stroke="none">Main Memory</text><text x="210" y="383" font-size="16" text-anchor="middle" fill="currentColor" stroke="none">Access time (including L1 and L2 cache miss</text><text x="210" y="407" font-size="16" text-anchor="middle" fill="currentColor" stroke="none">penalty) = 200 ns</text></svg>
