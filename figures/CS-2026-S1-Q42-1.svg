<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 375"><title>Control flow graph with blocks B1 through B5</title><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="currentColor"/></marker></defs><text x="155" y="17" font-size="14" text-anchor="start" fill="currentColor">ENTRY</text><path d="M150 10 L150 38" fill="none" stroke="currentColor" marker-end="url(#arrow)"/><rect x="105" y="40" width="90" height="32" fill="none" stroke="currentColor"/><text x="199" y="50" font-size="14" text-anchor="start" fill="currentColor">B1</text><text x="150.0" y="62" font-size="16" text-anchor="middle" fill="currentColor">a = b + i</text><rect x="20" y="108" width="110" height="70" fill="none" stroke="currentColor"/><text x="134" y="118" font-size="14" text-anchor="start" fill="currentColor">B2</text><text x="75.0" y="130" font-size="16" text-anchor="middle" fill="currentColor">a = g * k</text><text x="75.0" y="150" font-size="16" text-anchor="middle" fill="currentColor">f = d − f</text><text x="75.0" y="170" font-size="16" text-anchor="middle" fill="currentColor">a = c * 4</text><rect x="190" y="108" width="110" height="50" fill="none" stroke="currentColor"/><text x="304" y="118" font-size="14" text-anchor="start" fill="currentColor">B3</text><text x="245.0" y="130" font-size="16" text-anchor="middle" fill="currentColor">t = g * k</text><text x="245.0" y="150" font-size="16" text-anchor="middle" fill="currentColor">b = c + m</text><rect x="110" y="218" width="100" height="48" fill="none" stroke="currentColor"/><text x="214" y="228" font-size="14" text-anchor="start" fill="currentColor">B4</text><text x="160.0" y="240" font-size="16" text-anchor="middle" fill="currentColor">x = g * k</text><text x="160.0" y="260" font-size="16" text-anchor="middle" fill="currentColor">y = b + i</text><rect x="110" y="302" width="100" height="32" fill="none" stroke="currentColor"/><text x="214" y="312" font-size="14" text-