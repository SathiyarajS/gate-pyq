<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 250"><title>SDD1 grammar and semantic rules</title><text x="165" y="22" font-size="17" text-anchor="middle" fill="currentColor">SDD1</text><text x="56" y="44" font-size="15" text-anchor="middle" fill="currentColor">Grammar</text><text x="56" y="65" font-size="15" text-anchor="middle" fill="currentColor">(G1)</text><text x="222" y="50" font-size="15" text-anchor="middle" fill="currentColor">Semantic Rules</text><path d="M5 28 L325 28" fill="none" stroke="currentColor"/><path d="M5 76 L325 76" fill="none" stroke="currentColor"/><text x="12" y="98" font-size="15" text-anchor="start" fill="currentColor">D → T V</text><text x="119" y="98" font-size="15" text-anchor="start" fill="currentColor">D.type = T.type</text><text x="119" y="118" font-size="15" text-anchor="start" fill="currentColor">V.type = T.type</text><path d="M5 125 L325 125" fill="none" stroke="currentColor"/><text x="12" y="143" font-size="15" text-anchor="start" fill="currentColor">T → int</text><text x="119" y="143" font-size="15" text-anchor="start" fill="currentColor">T.type = int</text><path d="M5 150 L325 150" fill="none" stroke="currentColor"/><text x="12" y="168" font-size="15" text-anchor="start" fill="currentColor">T → float</text><text x="119" y="168" font-size="15" text-anchor="start" fill="currentColor">T.type = float</text><path d="M5 175 L325 175" fill="none" stroke="currentColor"/><text x="12" y="193" font-size="15" text-anchor="start" fill="currentColor">V → V₁ id</text><text x="119" y="193" font-size="15" text-anchor="start" fill="currentColor">V₁.type = V.type</text><text x="119" y="213" font-size="15" text-anchor="start" fill="currentColor">put(id.entry, V.type)</text><path d="M5 220 L325 220" fill="none" stroke="currentColor"/><text x="12" y="238" font-size="15" text-anchor="start" fill="currentColor">V → id</text><text x="119" y="238" font-size="15" text-anchor="start" fill="currentColor">put(id.entry, V.type)</text><path d="M5 245 L325 245" fill="none" stroke="currentColor"/><rect x="5" y="3" width="320" height="242" fill="none" stroke="currentColor"/><path d="M110 28 L110 245" fill="none" stroke="currentColor"/></svg>