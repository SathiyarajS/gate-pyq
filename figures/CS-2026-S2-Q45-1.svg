<title id="title">Control flow graph</title><desc id="desc">ENTRY leads to B1: a = b + c. B1 branches to B2: d = a + e, and B3: e = a + f. B3 loops back to B1. B2 leads to B4: g = d + e; B4 leads to EXIT.</desc><g fill="currentColor" id="graph0" transform="scale(1 1) rotate(0) translate(-30.5 404)">
