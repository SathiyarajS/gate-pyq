<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Finite automata D1 and D2" viewBox="0.00 0.00 706.00 379.00">
<title id="title">Finite automata D1 and D2</title><desc id="desc">Both automata have unlabeled states; only the start state is accepting. For accessible reference, call the D1 states s (start), u (upper middle), w (upper right), z (top right), v (lower middle), t (bottom left). Transitions: s to u on 0; s to v on 1; u to w on 0; u to z on 1; w to s on 0 and 1; z to s on 0; v to t on 0; t to s on 1. For D2, call the states s (start), u (upper middle), w (upper right), v (lower middle), t (bottom left). Transitions: s to u on 0; s to v on 1; u to w on 1; w to s on 1; v to w on 1; v to t on 0 and 1; t to s on 0. These reference names are not labels in the original drawing.</desc><g fill="currentColor" id="graph0" transform="scale(1 1) rotate(0) translate(-16 389)">
