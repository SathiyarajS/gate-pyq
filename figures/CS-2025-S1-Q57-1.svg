<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 675 245"><title>IPv4 route through two routers</title><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="currentColor"/></marker></defs><rect x="10" y="10" width="100" height="80" fill="none" stroke="currentColor"/><text x="60" y="55" font-size="16" text-anchor="middle" fill="currentColor" stroke="none">Source</text><rect x="550" y="10" width="110" height="80" fill="none" stroke="currentColor"/><text x="605" y="55" font-size="16" text-anchor="middle" fill="currentColor" stroke="none">Destination</text><rect x="150" y="145" width="175" height="80" fill="none" stroke="currentColor"/><text x="237.5" y="178" font-size="16" text-anchor="middle" fill="currentColor" stroke="none">Router-1</text><text x="237.5" y="204" font-size="16" text-anchor="middle" fill="currentColor" stroke="none">(MTU=5000 bytes)</text><rect x="365" y="145" width="175" height="80" fill="none" stroke="currentColor"/><text x="452.5" y="178" font-size="16" text-anchor="middle" fill="currentColor" stroke="none">Router-2</text><text x="452.5" y="204" font-size="16" text-anchor="middle" fill="currentColor" stroke="none">(MTU=3000 bytes)</text><path d="M60 90 V185 H150" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M325 185 H365" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M540 185 H605 V90" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/></svg>
