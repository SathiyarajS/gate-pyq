<title id="title">GATE 2019 CS, General Aptitude Q10: four hostel allocation plans</title>
<desc id="desc">Accessible reconstruction of official page 3. All four plans have identical room boundaries and occupancy. North points upper-left, east upper-right, south lower-right, west lower-left. Gray rooms are occupied. Detailed room-by-room description and all option placements are in question.md. Dimensions are drawing coordinates only; the source supplies no architectural dimensions.</desc>
